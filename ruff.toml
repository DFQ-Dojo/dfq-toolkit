# Shared lint/format settings for the monorepo.
# yolov5/ keeps its own [tool.ruff] section (line-length 120) from upstream.
line-length = 80

[lint]
select = ["E9", "F"]
ignore = [
    "F403", # star imports are used intentionally in a few config modules
    "F405",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports
