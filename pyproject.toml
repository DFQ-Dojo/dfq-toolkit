[project]
name = "dfq-toolkit"
version = "0.2.0"
description = "Task-specific zero-shot quantization-aware training for object detection"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "pillow>=12.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "torch>=2.15",
    "torchvision>=0.29",
]

[project.optional-dependencies]
# Pick one wheel source for PyTorch: `uv sync --extra cpu` or `uv sync --extra cu132`.
cpu = ["torch>=2.15", "torchvision>=0.29"]
cu132 = ["torch>=2.15", "torchvision>=0.29"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dfq"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torchvision.*", "pycocotools.*", "yaml.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
