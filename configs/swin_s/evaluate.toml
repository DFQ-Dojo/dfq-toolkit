[model]
family = "swin_s"
weights = "weights/mask_rcnn_swin-s-p4-w7_fpn_fp16_ms-crop-3x_coco_20210903_104808-b92c91f1.pth"

[validation]
images = "data/coco/val2017"
annotations = "data/coco/annotations/instances_val2017.json"
