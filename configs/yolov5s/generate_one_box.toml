# Stage I, step 1 for YOLOv5s: generate 160 x 160 images from one random box each, with adaptive
# box sampling (the old yolov5/README.md "Adaptive Label Sampling" with data/hyps/hyp.distill.yaml).
# Its labels.jsonl starts step 2.
labels = "outputs/labels/one_box.jsonl"
output = "outputs/yolov5s/one_box"
size = [160, 160]
batch_size = 64
count = 2048
verify = true

[model]
family = "yolov5s"
weights = "weights/yolov5s.pt"
image_size = 160

[generation]
iterations = 2500
lr = 0.2
schedule = "cosine"
init = "uniform_pixels"
clamp = true
verify_every = 50
augment = { erase = true }
weights = { detection = 0.5, tv_l1 = 0.0, tv_l2 = 0.0005, batch_norm = 0.01, first_batch_norm = 2.0 }
box_sampling = { start = 800, stop = 2800, confidence = 0.2, overlap_iou = 0.35, min_area = 0.01, max_area = 0.85 }
