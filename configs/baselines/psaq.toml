# The PSAQ-ViT baseline: 2048 images generated by the ImageNet Swin-T classifier (the old
# vit/baseline/psaq/generate_data.py). Train on them with configs/swin_t/qat_ours.toml and
# data.directories=["outputs/baselines/psaq"]. load_final_norm = true runs a corrected baseline.
weights = "weights/swin_tiny_patch4_window7_224.pth"
output = "outputs/baselines/psaq"
count = 2048
batch_size = 32
steps = 500
load_final_norm = false
