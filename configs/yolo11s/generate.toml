# Stage I, step 2 for YOLO11s: generate the 640 x 640 calibration images from the boxes that step 1
# ended with, without box sampling (the old yolo11/generation/config/relabel-syn.json).
labels = "outputs/yolo11s/one_box/labels.jsonl"
output = "outputs/yolo11s/generated"
size = [640, 640]
batch_size = 32
count = 2048
verify = true

[model]
family = "yolo11s"
weights = "weights/yolo11s.pt"

[generation]
iterations = 3000
lr = 0.2
schedule = "cosine_after_step"
init = "uniform_pixels"
clamp = false
verify_every = 100
weights = { detection = 0.5, tv_l1 = 0.0, tv_l2 = 0.002, batch_norm = 0.05, first_batch_norm = 5.0 }
